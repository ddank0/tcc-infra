services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Não é um serviço de longa duração por natureza: fica de pé com sleep
  # infinity para aceitar docker compose exec, que é instantâneo. Com
  # docker compose run, cada ciclo de teste criaria um container novo.
  jobs:
    build:
      context: ../tcc-jobs
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: tcc-jobs
    volumes:
      - ../tcc-jobs:/app
      - jobs-venv:/opt/venv
      - ../data:/data
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  jobs-venv:
